<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一束光，打开大脑的开关</title>
<style>
  html, body { margin: 0; background: #05070d; }
  canvas { display: block; width: min(100vw, calc(100vh * 9 / 16)); height: auto; margin: 0 auto; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 8px; background: #0008; color: #ccd; font: 13px/1.4 -apple-system, sans-serif; }
  #bar input { flex: 1; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div id="bar"><button id="play">播放</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="clock">0.00</span></div>
<script src="build/timeline.js"></script>
<script>
// ============ 基础 ============
const W = 1080, H = 1920, FPS = 30;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const C = {
  bg: '#070b16', grid: 'rgba(110,150,230,0.06)', text: '#f3f6fb', mute: '#8d98b0', dim: '#27304a',
  blue: '#3d9bff', cyan: '#4de8ff', gold: '#e8c26a', green: '#79e08a', orange: '#ff9a3c', red: '#ff5a6a',
  violet: '#b391ff', pink: '#ff7eb6', amber: '#ffb020', panel: 'rgba(20,28,46,0.92)', line: 'rgba(140,170,230,0.22)'
};
const TYPES = [C.blue, C.pink, C.green, C.amber];          // 四类神经元（蓝色那类会被装上光控开关）
const CN = '"PingFang SC", "Hiragino Sans GB", sans-serif';
const NUM = '"Avenir Next", "Helvetica Neue", sans-serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - clamp(k), 3);
const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const eb = k => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const P = (t, a, d = 0.4) => clamp((t - a) / d);
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };

// ============ 时间轴：按口播字对齐 ============
const TL = window.TL;
const SEG = Object.fromEntries(TL.segments.map(s => [s.id, s]));
const PUN = /[，。！？、；：“”‘’（）《》,.!?;:()"'·…—\-%\s]/g;
function at(id, phrase, k = 0, end = false) {
  const s = SEG[id]; const ph = phrase.replace(PUN, '');
  let pos = -1; for (let i = 0; i <= k; i++) pos = s.clean.indexOf(ph, pos + 1);
  if (pos < 0) { console.warn('phrase not found', id, phrase); return s.start; }
  if (end) { const j = Math.min(s.ct.length - 1, pos + ph.length); return s.start + (pos + ph.length >= s.ct.length ? s.dur : s.ct[j]); }
  return s.start + s.ct[pos];
}
const atE = (id, ph, k = 0) => at(id, ph, k, true);
const S0 = id => SEG[id].start, S1 = id => SEG[id].start + SEG[id].dur;

const SCENES = [];
for (const s of TL.segments) {
  const last = SCENES[SCENES.length - 1];
  if (!last || last.name !== s.scene) SCENES.push({ name: s.scene, a: Math.max(0, s.start - 0.25) });
}
SCENES.forEach((s, i) => s.b = i + 1 < SCENES.length ? SCENES[i + 1].a : TL.total);
SCENES[0].a = 0;

// ============ 绘图工具 ============
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 600} ${o.size || 48}px ${o.font || CN}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 30; }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.stroke; ctx.strokeStyle = o.strokeColor || 'rgba(0,0,0,.85)'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || C.text; ctx.fillText(s, x, y);
  ctx.restore();
}
function rich(parts, cx, y, size, o = {}) {
  ctx.save(); ctx.textBaseline = 'middle'; if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
  const font = p => `${o.weight || 700} ${(p[3] || size)}px ${p[2] || o.font || CN}`;
  let w = 0; for (const p of parts) { ctx.font = font(p); w += ctx.measureText(p[0]).width; }
  let x = o.align === 'left' ? cx : cx - w / 2;
  for (const p of parts) {
    ctx.font = font(p); const pw = ctx.measureText(p[0]).width;
    if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = 24; }
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.stroke; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(p[0], x, y + (p[4] || 0)); }
    ctx.fillStyle = p[1] || C.text; ctx.fillText(p[0], x, y + (p[4] || 0)); x += pw;
  }
  ctx.restore(); return w;
}
function panel(x, y, w, h, o = {}) {
  ctx.save(); rr(x, y, w, h, o.r || 28);
  ctx.fillStyle = o.fill || C.panel; ctx.fill();
  ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.stroke || C.line; ctx.stroke(); ctx.restore();
}
function chip(s, x, y, o = {}) {
  ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha); ctx.font = `${o.weight || 600} ${o.size || 30}px ${CN}`;
  const w = ctx.measureText(s).width + (o.pad || 28) * 2, h = (o.size || 30) * 1.75;
  const X = o.align === 'left' ? x : x - w / 2;
  const col = o.color || C.blue;
  rr(X, y - h / 2, w, h, h / 2); ctx.fillStyle = o.fill || col + '22'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, X + w / 2, y + 1);
  ctx.restore(); return w;
}
function pop(k, f) { if (k <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(k * 2.5); f(eb(k)); ctx.restore(); }
function scaleAt(x, y, s) { ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-x, -y); }
function arrow(x1, y1, x2, y2, color, lw = 6, k = 1) {
  if (k <= 0) return;
  const x = lerp(x1, x2, k), y = lerp(y1, y2, k);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), s = lw * 3.2;
  ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * s * .6, y + Math.sin(a) * s * .6);
  ctx.lineTo(x - Math.cos(a - .55) * s, y - Math.sin(a - .55) * s); ctx.lineTo(x - Math.cos(a + .55) * s, y - Math.sin(a + .55) * s); ctx.fill();
  ctx.restore();
}
function glowDot(x, y, r, col, a = 1) {
  ctx.save(); ctx.globalAlpha *= clamp(a);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, col + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function avatar(x, y, r, ini, col) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col + '2a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke(); ctx.restore();
  txt(ini, x, y + 2, { size: r * 0.72, font: NUM, weight: 800, color: col });
}
// 蓝光光束（自上而下的锥形）
function lightCone(x, yTop, yBot, w0, w1, col, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(a);
  const g = ctx.createLinearGradient(0, yTop, 0, yBot); g.addColorStop(0, col + '00'); g.addColorStop(0.3, col + '55'); g.addColorStop(1, col + '22');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - w0 / 2, yTop); ctx.lineTo(x + w0 / 2, yTop); ctx.lineTo(x + w1 / 2, yBot); ctx.lineTo(x - w1 / 2, yBot); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ============ 背景与常驻元素 ============
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(540 + Math.sin(t * .25) * 140, 860, 40, 540, 860, 1100);
  g.addColorStop(0, 'rgba(40,100,220,0.24)'); g.addColorStop(1, 'rgba(7,11,22,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 漂浮的光点
  const R = rng(11);
  for (let i = 0; i < 46; i++) {
    const x = R() * W, y0 = R() * H, sp = 8 + R() * 18, y = ((y0 - t * sp) % H + H) % H;
    ctx.fillStyle = `rgba(120,180,255,${0.05 + 0.1 * R()})`; ctx.beginPath(); ctx.arc(x, y, 1.5 + R() * 2.5, 0, Math.PI * 2); ctx.fill();
  }
  const v = ctx.createLinearGradient(0, 1300, 0, H); v.addColorStop(0, 'rgba(5,7,13,0)'); v.addColorStop(1, 'rgba(5,7,13,0.88)');
  ctx.fillStyle = v; ctx.fillRect(0, 1300, W, H - 1300);
}

function headline(t) {
  const k3 = P(t, at('N2', '光遗传学'), 0.4);
  txt('2026 诺贝尔生理学或医学奖', 540, 200, { size: 34, weight: 700, color: C.gold });
  rich([['一束', C.text], ['光', C.blue], ['，打开大脑的开关', C.text]], 540, 292, 74, { weight: 800, glow: 'rgba(61,155,255,.25)' });
  ctx.save(); ctx.globalAlpha = k3; ctx.save(); scaleAt(540, 390, lerp(1.25, 1, eo(k3)));
  rich([['光遗传学', C.cyan], [' · Optogenetics', C.cyan, NUM, 44]], 540, 390, 50, { weight: 800 });
  ctx.restore(); ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(77,232,255,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(540 - 300 * eo(k3), 444); ctx.lineTo(540 + 300 * eo(k3), 444); ctx.stroke(); ctx.restore();
}

function subtitles(t) {
  const c = TL.cues.find(c => t >= c.a && t < c.b + 0.02);
  if (!c) return;
  const k = P(t, c.a, 0.12);
  const parts = []; const re = /(\d[\d.]*%?|[A-Za-z][A-Za-z0-9.\-]*)/g; let last = 0, m;
  while ((m = re.exec(c.text))) { if (m.index > last) parts.push([c.text.slice(last, m.index), '#ffffff']); parts.push([m[0], C.gold]); last = m.index + m[0].length; }
  if (last < c.text.length) parts.push([c.text.slice(last), '#ffffff']);
  ctx.save(); ctx.globalAlpha = k;
  rich(parts, 540, 1470 + (1 - eo(k)) * 10, 62, { weight: 700, stroke: 12 });
  ctx.restore();
}

// ============ 角色与道具 ============
// 小鼠（侧面，朝右）。o: asleep, eye(0..1 睁眼), whisk, fear, fiber(0..1), fiberX, fiberTop(绝对 y), beam(0..1), beamCol
function mouse(x, y, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const fear = o.fear || 0, body = fear > 0 ? `rgb(${lerp(207, 255, fear * .35)},${lerp(213, 190, fear)},${lerp(226, 200, fear)})` : '#cfd5e2';
  if (fear > 0) { ctx.shadowColor = 'rgba(255,90,106,.9)'; ctx.shadowBlur = 40 * fear; }
  ctx.strokeStyle = '#d9a3a8'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-170, 30); ctx.bezierCurveTo(-260, 80, -300, -40, -390, 10); ctx.stroke();
  ctx.fillStyle = '#e8a9b2';
  for (const fx of [-95, 55]) { ctx.beginPath(); ctx.ellipse(fx, 98, 28, 12, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(-15, 12, 178, 100, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(150, -12, 100, 74, -0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(228, 4, 50, 34, -0.1, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(100, -78, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f0b7c0'; ctx.beginPath(); ctx.arc(100, -78, 29, 0, Math.PI * 2); ctx.fill();
  // 眼
  const eye = o.asleep ? 0 : (o.eye ?? 1);
  if (eye > 0.5) {
    ctx.fillStyle = '#10141f'; ctx.beginPath(); ctx.arc(190, -28, 11 + (fear > 0 ? 2 : 0), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(194, -32, 3.5, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.strokeStyle = '#2b3245'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(190, -32, 11, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  }
  ctx.fillStyle = '#f08a9a'; ctx.beginPath(); ctx.arc(276, 0, 10, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 2.5;
  for (const a0 of [-0.28, 0, 0.28]) { const a = a0 + (o.whisk || 0); ctx.beginPath(); ctx.moveTo(258, 10); ctx.lineTo(258 + Math.cos(a) * 115, 10 + Math.sin(a) * 115); ctx.stroke(); }
  // 光纤
  if (o.fiber > 0) {
    const fx = o.fiberX ?? 135, top = ((o.fiberTop ?? (y - 400)) - y) / s, b = o.beam || 0, col = o.beamCol || C.blue;
    ctx.save(); ctx.globalAlpha *= clamp(o.fiber);
    ctx.fillStyle = '#7d879c'; ctx.fillRect(fx - 14, -118, 28, 34);
    ctx.strokeStyle = b > 0 ? col : '#9aa4ba'; ctx.lineWidth = 7; if (b > 0) { ctx.shadowColor = col; ctx.shadowBlur = 30 * b; }
    ctx.beginPath(); ctx.moveTo(fx, top); ctx.lineTo(fx, -60); ctx.stroke();
    ctx.restore();
    if (b > 0) { glowDot(fx, -50, 110, col, b); glowDot(fx, -50, 34, '#ffffff', b * .8); }
  }
  ctx.restore();
}
function zzz(x, y, t, a) {
  if (a <= 0) return;
  for (let i = 0; i < 3; i++) {
    const p = ((t * 0.5 + i / 3) % 1);
    txt('Z', x + p * 60 + i * 6, y - p * 110, { size: 34 + p * 26, font: NUM, weight: 800, color: C.mute, alpha: a * Math.sin(p * Math.PI) });
  }
}

// 大脑（侧面）：几个圆的并集 + 小脑 + 脑干
const BRAIN = [[-175, -5, 150], [-45, -80, 172], [105, -62, 165], [215, 25, 122], [-205, 65, 112], [-60, 62, 165], [100, 68, 150]];
function brainPath() { ctx.beginPath(); for (const [x, y, r] of BRAIN) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); } }
const inBrain = (x, y, m = 0) => BRAIN.some(([cx, cy, r]) => Math.hypot(x - cx, y - cy) < r - m);
const BRAIN_PTS = (() => { const R = rng(5), out = []; let n = 0; while (out.length < 620 && n++ < 20000) { const x = -370 + R() * 720, y = -260 + R() * 460; if (inBrain(x, y, 16)) out.push({ x, y, ty: Math.floor(R() * 4), ph: R() * 6.28 }); } return out; })();
const SULCI = (() => { const R = rng(9), out = []; for (let i = 0; i < 11; i++) { const x = -300 + R() * 560, y = -200 + R() * 330; out.push([x, y, x + 40 + R() * 60, y - 50 + R() * 100, x + 60 + R() * 90, y - 30 + R() * 80]); } return out; })();
function brain(x, y, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const fill = o.fill || '#1a2742', stroke = o.stroke || 'rgba(140,180,255,.7)';
  ctx.fillStyle = '#16213a'; ctx.strokeStyle = stroke; ctx.lineWidth = 3 / s * 1.4;
  rr(70, 160, 62, 140, 26); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(190, 175, 95, 62, -0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.ellipse(190, 175, 95, 62, -0.1, 0, Math.PI * 2); ctx.clip(); ctx.lineWidth = 2;
  for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(90, 175 + i * 16); ctx.quadraticCurveTo(190, 160 + i * 18, 290, 172 + i * 16); ctx.stroke(); } ctx.restore();
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = 50; }
  ctx.lineWidth = 6 / s * 1.4; brainPath(); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = fill; brainPath(); ctx.fill();
  ctx.save(); brainPath(); ctx.clip(); ctx.strokeStyle = o.sulc || 'rgba(140,180,255,.22)'; ctx.lineWidth = 4;
  for (const [a, b, c, d, e, f] of SULCI) { ctx.beginPath(); ctx.moveTo(a, b); ctx.quadraticCurveTo(c, d, e, f); ctx.stroke(); }
  if (o.inner) o.inner();
  ctx.restore();
  ctx.restore();
}

// 衣藻：前端（+x）两根鞭毛，橙色眼点
function alga(x, y, s, ang, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  const ph = o.ph || 0;
  ctx.strokeStyle = 'rgba(200,240,200,.75)'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(42, sd * 6);
    ctx.bezierCurveTo(72, sd * (12 + 10 * Math.sin(ph)), 92, sd * (40 + 22 * Math.sin(ph + 1)), 62 + 12 * Math.cos(ph), sd * (74 + 14 * Math.sin(ph + .5)));
    ctx.stroke();
  }
  const g = ctx.createRadialGradient(10, -8, 4, 0, 0, 52); g.addColorStop(0, '#9be89a'); g.addColorStop(1, '#2f8f4c');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 48, 38, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(20,90,45,.55)'; ctx.beginPath(); ctx.ellipse(-10, 0, 34, 30, 0, Math.PI * 0.5, Math.PI * 1.5); ctx.ellipse(-2, 0, 18, 18, 0, Math.PI * 1.5, Math.PI * 0.5, true); ctx.fill();
  ctx.fillStyle = 'rgba(230,255,230,.55)'; ctx.beginPath(); ctx.arc(14, 2, 11, 0, Math.PI * 2); ctx.fill();
  if (o.spot > 0) glowDot(12, -30, 26, C.orange, o.spot);
  ctx.fillStyle = C.orange; ctx.beginPath(); ctx.arc(12, -30, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 细胞膜 + 通道
function membrane(x0, x1, y, chans, open, o = {}) {
  const near = x => chans.some(c => Math.abs(x - c) < 44);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,214,150,.45)'; ctx.lineWidth = 2.5;
  for (let x = x0; x <= x1; x += 22) {
    if (near(x)) continue;
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x - 3, y + sd * 26); ctx.lineTo(x - 3, y + sd * 6); ctx.moveTo(x + 3, y + sd * 26); ctx.lineTo(x + 3, y + sd * 6); ctx.stroke(); }
    ctx.fillStyle = '#e6b36a';
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(x, y + sd * 32, 9, 0, Math.PI * 2); ctx.fill(); }
  }
  for (const cx of chans) {
    const g = lerp(4, 30, eo(open)), col = open > 0.05 ? C.blue : C.violet;
    ctx.save(); if (open > 0.05) { ctx.shadowColor = C.blue; ctx.shadowBlur = 30 * open; }
    ctx.fillStyle = col; rr(cx - g / 2 - 34, y - 64, 34, 128, 14); ctx.fill(); rr(cx + g / 2, y - 64, 34, 128, 14); ctx.fill();
    ctx.restore();
    if (o.label) txt(o.label, cx, y - 92, { size: 24, weight: 700, color: col, alpha: o.labelA ?? 1 });
  }
  ctx.restore();
}
function ion(x, y, a = 1) {
  ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = '#ffd84a'; ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#3a2a00'; ctx.font = `800 22px ${NUM}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', x, y + 1); ctx.restore();
}
function ionFlow(cx, y, t, open, seed) {
  const R = rng(seed);
  for (let i = 0; i < 7; i++) {
    const sx = cx + (R() - .5) * 180, ex = cx + (R() - .5) * 160, ph = R();
    if (open < 0.4) { ion(sx + Math.sin(t * 1.3 + i) * 12, y - 140 + Math.cos(t * 1.1 + i * 2) * 14, 0.9); continue; }
    const p = (t * 0.55 + ph) % 1;
    let X, Y;
    if (p < .4) { X = lerp(sx, cx, eio(p / .4)); Y = lerp(y - 150, y - 50, p / .4); }
    else if (p < .6) { X = cx; Y = lerp(y - 50, y + 50, (p - .4) / .2); }
    else { X = lerp(cx, ex, eo((p - .6) / .4)); Y = lerp(y + 50, y + 160, (p - .6) / .4); }
    ion(X, Y, Math.min(1, (1 - p) * 6, p * 8));
  }
}

// 神经元：胞体在 (0,0)，树突向左，轴突向右
function buildNeuron(seed, axLen) {
  const R = rng(seed), segs = [], dots = [];
  const br = (x, y, a, len, w, d) => {

  if (label) chip(label, 540, 1310, { color: lc, size: 34, fill: 'rgba(10,16,30,.95)' });
};

scenes.why = (t) => {
  const tType = at('N14', '特定类型'), tSw = at('N14', '装上光控开关'), tOn = at('N14', '想开就开'), tOff = at('N14', '想关就关'), tQ = at('N14', '第一次能直接回答'), tCause = at('N14', '导致了');
  const k15 = P(t, S0('N15') - .1, .5);
  const kF = P(t, S0('N14'), .5) * (1 - k15);
  if (kF > 0) {
    ctx.save(); ctx.globalAlpha *= kF;
    const R = rng(41), cells = [];
    for (let n = 0; cells.length < 70 && n < 3000; n++) { const x = 150 + R() * 780, y = 600 + R() * 360; if (cells.every(c => Math.hypot(c.x - x, c.y - y) > 44)) cells.push({ x, y, ty: Math.floor(R() * 4), ph: R() * 6 }); }
    panel(110, 570, 860, 420, { fill: 'rgba(14,20,34,.7)' });
    const sel = P(t, tType, .4), on = P(t, tOn, .3) * (1 - P(t, tOff, .3)), off = P(t, tOff, .3) * (1 - P(t, tQ, .4));
    if (on > 0) lightCone(540, 470, 990, 300, 860, C.blue, on * .6);
    if (off > 0) lightCone(540, 470, 990, 300, 860, C.amber, off * .5);
    for (const c of cells) {
      let col = TYPES[c.ty], a = .8, r = 13;
      if (c.ty === 0) {
        if (on > 0) { glowDot(c.x, c.y, 40, C.blue, on); col = '#e4f2ff'; a = 1; r = 15; }
        if (off > 0) { col = '#2a3550'; a = 1; }
      } else a *= lerp(1, .55, sel);
      ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      if (c.ty === 0 && sel > 0) { ctx.save(); ctx.globalAlpha *= sel; ctx.strokeStyle = C.cyan; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c.x, c.y, 22, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
    }
    if (sel > 0) chip(P(t, tSw, .3) > 0 ? '只给这一类装上光控开关' : '只选一类神经元', 540, 1040, { color: C.cyan, alpha: sel * (1 - P(t, tOn - .45, .25)), size: 30 });
    // 开关
    const kt = P(t, tOn - .2, .3);
    if (kt > 0) {
      ctx.save(); ctx.globalAlpha *= kt * (1 - P(t, tQ, .4));
      const pill = (x, label, col, active) => { rr(x - 170, 1010, 340, 64, 32); ctx.fillStyle = active ? col + '44' : 'rgba(20,28,46,.9)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = active ? col : C.line; ctx.stroke(); txt(label, x, 1043, { size: 32, weight: 800, color: active ? col : C.mute }); };
      pill(330, '开 · 蓝光', C.blue, on > .5); pill(750, '关 · 黄光', C.amber, off > .5);
      ctx.restore();
    }
    const kq = P(t, tQ, .4);
    if (kq > 0) {
      ctx.save(); ctx.globalAlpha *= kq;
      panel(110, 1150, 860, 210, { stroke: 'rgba(232,194,106,.6)' });
      txt('第一次能直接验证因果', 540, 1200, { size: 32, color: C.gold, weight: 700 });
      const kc = P(t, tCause - .3, .4);
      chip('这群细胞', 300, 1290, { color: C.blue, size: 36 });
      arrow(420, 1290, 650, 1290, C.gold, 6, eo(kc));
      chip('这个行为', 780, 1290, { color: C.text, size: 36, alpha: kc });
      ctx.restore();
    }
    ctx.restore();
  }
  // —— N15：回路与疾病 ——
  if (k15 > 0) {
    ctx.save(); ctx.globalAlpha *= k15;
    txt('找到的神经回路', 540, 560, { size: 40, weight: 800, color: C.cyan });
    const A = [['疼痛', 0], ['口渴', 0], ['进食', 0], ['奖赏', 1], ['社交', 1]];
    const xs0 = [240, 540, 840], xs1 = [390, 690];
    A.forEach(([w, row], i) => { const x = row ? xs1[i - 3] : xs0[i], y = 660 + row * 110; pop(P(t, at('N15', w) - .1, .35), s => { scaleAt(x, y, s); chip(w, x, y, { color: C.cyan, size: 44, fill: 'rgba(77,232,255,.12)' }); }); });
    const kd = P(t, at('N15', '重新理解'), .4);
    txt('重新理解的疾病', 540, 970, { size: 40, weight: 800, color: C.violet, alpha: kd });
    const D = [['抑郁', 240, 1070], ['焦虑', 540, 1070], ['帕金森', 840, 1070], ['阿尔茨海默病', 540, 1180]];
    D.forEach(([w, x, y]) => pop(P(t, at('N15', w) - .1, .35), s => { scaleAt(x, y, s); chip(w, x, y, { color: C.violet, size: 44, fill: 'rgba(179,145,255,.12)' }); }));
    ctx.restore();
  }
};

scenes.clinic = (t) => {
  const tBed = S0('N16'), tRP = at('N16', '视网膜色素变性'), tDie = at('N16', '死掉'), tProt = at('N16', '光敏蛋白'), tSend = at('N16', '送进'), tGl = at('N16', '发光眼镜'), tSee = at('N16', '部分恢复'), tObj = at('N16', '分辨并抓起');
  pop(P(t, tBed, .4), s => { scaleAt(540, 545, s); chip('走向临床试验', 540, 545, { color: C.gold, size: 32 }); });
  const EX = 640, EY = 880, ER = 220;
  const kE = P(t, tRP - .3, .5);
  if (kE <= 0) return;
  ctx.save(); ctx.globalAlpha *= kE;
  const dead = eo(P(t, tDie, 1.0)), chr = P(t, tSend + .2, 1.2), see = P(t, tSee, .6);
  // 眼镜发出的光
  const kg = P(t, tGl, .4);
  if (see > 0) {
    const pulse = 0.7 + 0.3 * Math.sin(t * 8);
    ctx.save(); ctx.globalAlpha *= see * pulse; ctx.strokeStyle = C.amber; ctx.lineWidth = 4; ctx.shadowColor = C.amber; ctx.shadowBlur = 16;
    for (let i = -2; i <= 2; i++) { const yy = EY + i * 34, lx = EX - ER * .66, ta = i * 0.38; ctx.beginPath(); ctx.moveTo(260, yy); ctx.lineTo(lx, EY + i * 12); ctx.lineTo(EX + Math.cos(-ta) * (ER - 62), EY - Math.sin(-ta) * (ER - 62) * -1); ctx.stroke(); }
    ctx.restore();
  }
  eyeball(EX, EY, ER, { dead, drop: dead, chr, lit: see > 0 ? 0.6 + 0.4 * Math.sin(t * 8) : 0 });
  // 标注
  const kr = P(t, tRP, .4) * (1 - P(t, tDie - .1, .3));
  if (kr > 0) { ctx.save(); ctx.globalAlpha *= kr; ctx.strokeStyle = '#ff9db0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(EX + 150, EY - 150); ctx.lineTo(EX + 230, EY - 250); ctx.stroke(); ctx.restore(); chip('视网膜 · 感光细胞', EX + 160, EY - 262, { color: '#ff9db0', alpha: kr, size: 28 }); }
  if (dead > 0) chip('感光细胞死掉 → 失明', 540, 1180, { color: C.red, alpha: P(t, tDie, .3) * (1 - P(t, tProt, .3)), size: 32 });
  // 注射
  const ki = P(t, tSend - .3, .5) * (1 - P(t, tGl, .4));
  if (ki > 0) {
    ctx.save(); ctx.globalAlpha *= ki; const d = (1 - eo(P(t, tSend - .3, .6))) * 80;
    ctx.strokeStyle = '#c8d2e6'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(EX + 340 + d, EY - 300 - d); ctx.lineTo(EX + 120 + d, EY - 90 - d); ctx.stroke(); ctx.restore();
  }
  if (P(t, tProt, .3) > 0) chip('送入光敏蛋白', 540, 1180, { color: C.amber, alpha: P(t, tProt, .3) * (1 - P(t, tGl, .3)), size: 32 });
  // 眼镜
  if (kg > 0) {
    ctx.save(); ctx.globalAlpha *= kg; rr(190, EY - 120, 60, 240, 24); ctx.fillStyle = '#1d2740'; ctx.fill(); ctx.strokeStyle = '#c8d2e6'; ctx.lineWidth = 4; ctx.stroke();
    glowDot(220, EY, 90, C.amber, .6 + .3 * Math.sin(t * 8)); ctx.restore();
    txt('特制发光眼镜', 220, EY + 170, { size: 28, color: C.amber, alpha: kg });
  }
  ctx.restore();
  // 桌上的物体
  const ko = P(t, tObj - .4, .4);
  if (ko > 0) {
    ctx.save(); ctx.globalAlpha *= ko;
    ctx.strokeStyle = '#8d98b0'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(260, 1330); ctx.lineTo(820, 1330); ctx.stroke();
    ctx.fillStyle = '#c9d3e8'; rr(380, 1225, 70, 105, 10); ctx.fill(); ctx.strokeStyle = '#c9d3e8'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(455, 1275, 24, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.fillStyle = '#9fb0d0'; rr(600, 1245, 110, 85, 8); ctx.fill();
    const h = P(t, tObj, .4);
    ctx.setLineDash([10, 8]); ctx.strokeStyle = C.amber; ctx.lineWidth = 4; ctx.globalAlpha *= h;
    rr(360, 1205, 140, 140, 14); ctx.stroke(); rr(582, 1225, 146, 120, 14); ctx.stroke();
    ctx.restore();
    txt('部分恢复视觉', 540, 1385, { size: 30, color: C.amber, alpha: P(t, tObj, .4) });
  } else if (see > 0) chip('部分恢复视觉', 540, 1180, { color: C.amber, alpha: see, size: 32 });
};

scenes.outro = (t) => {
  const t30 = at('N17', '三十多年前'), tQ = at('N17', '为什么会游向光'), tCur = at('N17', '好奇心'), tBr = at('N17', '照亮了大脑');
  const kB = P(t, tCur, .6);
  // 光源
  const k = P(t, S0('N17'), .6);
  glowDot(540, 600, lerp(160, 260, kB), kB > 0 ? '#bfe0ff' : '#fff6c8', k * .9);
  // 小绿藻游向光
  const ka = k * (1 - kB);
  if (ka > 0) {
    ctx.save(); ctx.globalAlpha *= ka;
    const p = eo(P(t, S0('N17'), 9));
    alga(540 + Math.sin(t * 1.4) * 20, lerp(1150, 860, p), 1.6, -Math.PI / 2 + Math.sin(t * 2) * .12, { ph: t * 11, spot: .6 });
    ctx.restore();
  }
  const k30 = P(t, t30, .4) * (1 - kB);
  if (k30 > 0) txt('三十多年前，一个看似没用的问题', 540, 1230, { size: 40, color: C.mute, alpha: k30 });
  const kq = P(t, tQ, .45) * (1 - kB);
  pop(kq, s => { scaleAt(540, 1320, s); txt('绿藻为什么会游向光？', 540, 1320, { size: 60, weight: 800, color: C.green, glow: 'rgba(121,224,138,.4)' }); });
  // 大脑被照亮
  if (kB > 0) {
    ctx.save(); ctx.globalAlpha *= kB;
    brain(540, 870, .8, { glow: 'rgba(61,155,255,.8)', fill: '#1b3260', inner: () => { for (const p of BRAIN_PTS) { if (p.ty) continue; const a = .5 + .5 * Math.sin(t * 3 + p.ph); ctx.fillStyle = `rgba(160,210,255,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill(); } } });
    ctx.restore();
    txt('好奇心', 540, 1180, { size: 54, weight: 700, color: C.text, alpha: kB });
    const kl = P(t, tBr, .45);
    pop(kl, s => { scaleAt(540, 1275, s); txt('最后照亮了大脑', 540, 1275, { size: 72, weight: 800, color: C.gold, glow: 'rgba(232,194,106,.5)' }); });
    txt('资料：NobelPrize.org 新闻稿与科普背景', 540, 1370, { size: 26, color: C.mute, alpha: P(t, S1('N17') + .2, .5) });
  }
};

// ============ 音效事件（导出给混音） ============
function sfxEvents() {
  const E = [];
  SCENES.forEach((s, i) => { if (i) E.push({ t: s.a, n: 'whoosh' }); });
  E.push(
    { t: at('N1', '一束蓝光') + .3, n: 'zap' }, { t: at('N1', '立刻醒来'), n: 'pop' }, { t: at('N1', '换一群') + .5, n: 'zap' }, { t: at('N1', '突然僵住'), n: 'down' },
    { t: at('N2', '光遗传学'), n: 'rise' }, { t: at('N2', '2026'), n: 'hit' },
    { t: at('N3', '彼得') - .15, n: 'pop' }, { t: at('N3', '格奥尔格') - .15, n: 'pop' }, { t: at('N3', '卡尔') - .15, n: 'pop' }, { t: at('N3', '控制神经元'), n: 'tick' },
    { t: at('N4', '九百亿'), n: 'pop' }, { t: at('N4', '很难证明'), n: 'down' }, { t: at('N5', '一起激活'), n: 'zap' }, { t: at('N5', '克里克') - .1, n: 'pop' }, { t: at('N5', '精确地开关'), n: 'rise' },
    { t: at('N6', '朝着光游'), n: 'swish' }, { t: at('N6', '橙色'), n: 'pop' }, { t: at('N6', '电信号'), n: 'zap' }, { t: at('N6', '二十多倍'), n: 'hit' },
    { t: at('N7', '有一个蛋白'), n: 'pop' }, { t: at('N7', '没人见过'), n: 'hit' },
    { t: at('N8', '两个可疑'), n: 'tick' }, { t: at('N8', '注入'), n: 'swish' }, { t: at('N8', '光一照') + .1, n: 'zap' }, { t: at('N8', '通道就打开'), n: 'pop' },
    { t: S0('N9'), n: 'pop' }, { t: at('N9', '电信号'), n: 'zap' },
    { t: S0('N10'), n: 'pop' }, { t: at('N10', '治疗效果差'), n: 'down' },
    { t: at('N11', '写信'), n: 'swish' }, { t: at('N11', '2005'), n: 'tick' },
    { t: at('N12', '光一亮'), n: 'zap' }, { t: at('N12', '醒了'), n: 'pop' }, { t: at('N13', '重新激活'), n: 'zap' }, { t: at('N13', '吓得'), n: 'down' },
    { t: at('N14', '想开就开'), n: 'zap' }, { t: at('N14', '想关就关'), n: 'down' }, { t: at('N14', '导致了') - .3, n: 'hit' },
    ...['疼痛', '口渴', '进食', '奖赏', '社交', '抑郁', '焦虑', '帕金森', '阿尔茨海默病'].map(w => ({ t: at('N15', w) - .1, n: 'tick' })),
    { t: at('N16', '死掉'), n: 'down' }, { t: at('N16', '送进'), n: 'swish' }, { t: at('N16', '部分恢复'), n: 'rise' },
    { t: at('N17', '为什么会游向光'), n: 'pop' }, { t: at('N17', '照亮了大脑'), n: 'hit' });
  // 神经元：蓝光脉冲
  const tf = at('N11', '蓝光一闪'); for (let i = 0; i < 12; i++) if (tf + i * .42 < S1('N11') + .3) E.push({ t: tf + i * .42, n: 'tick' });
  return E.sort((a, b) => a.t - b.t);
}
window.sfxEvents = sfxEvents;

// ============ 合成 ============
function frameAt(t) {
  background(t);
  for (const s of SCENES) {
    const fadeIn = s.a === 0 ? 1 : P(t, s.a, 0.35), fadeOut = 1 - P(t, s.b, 0.3);
    if (t < s.a || t > s.b + 0.3) continue;
    ctx.save(); ctx.globalAlpha = fadeIn * fadeOut; ctx.translate(0, (1 - eo(fadeIn)) * 40);
    scenes[s.name](t); ctx.restore();
  }
  headline(t);
  subtitles(t);
}

function cover() {
  background(3);
  txt('2026 诺贝尔生理学或医学奖', 540, 250, { size: 46, color: C.gold, weight: 800 });

  txt('打开大脑的开关', 540, 580, { size: 110, weight: 800, color: C.text });
  lightCone(615, 680, 950, 40, 260, C.blue, 1);
  mouse(470, 1130, 1.25, { fiber: 1, fiberX: 115, fiberTop: 680, beam: 1, beamCol: C.blue });
  txt('光遗传学 · Optogenetics', 540, 1440, { size: 64, weight: 800, color: C.cyan, glow: 'rgba(77,232,255,.4)' });
  txt('从一种绿藻，到控制神经元', 540, 1540, { size: 46, weight: 700, color: C.mute });
}

window.renderFrame = (i) => frameAt(i / FPS);
window.renderCover = cover;
window.TOTAL_FRAMES = Math.round(TL.total * FPS);

const q = new URLSearchParams(location.search);
(async () => {
  await Promise.all([`800 40px ${CN}`, `700 40px ${CN}`, `600 40px ${CN}`, `800 40px ${NUM}`].map(f => document.fonts.load(f, '光遗传学0123')));
  if (q.get('mode') === 'render') { document.getElementById('bar').remove(); window.__ready = true; return; }
  const audio = new Audio(q.get('audio') || 'audio/vo.wav'); let playing = false;
  const seek = document.getElementById('seek'), clock = document.getElementById('clock');
  document.getElementById('play').onclick = () => { playing = !playing; playing ? audio.play() : audio.pause(); };
  seek.oninput = () => { audio.currentTime = seek.value / 1000 * TL.total; };
  (function loop() { const t = audio.currentTime; frameAt(t); clock.textContent = t.toFixed(2); if (!seek.matches(':active')) seek.value = t / TL.total * 1000; requestAnimationFrame(loop); })();
  window.__ready = true;
})();
